name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build .NET Framework projects
        run: msbuild FireEmblemThreeHouse.sln /restore /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Verify CLI save editing
        run: python tools/test_cli.py --cli FethCli/bin/Release/net472/FETH_Cli.exe

      - name: Package and verify downloads
        run: python tools/package.py

      - uses: actions/upload-artifact@v7
        with:
          name: fe3h-editor-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14
