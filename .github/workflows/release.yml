name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: microsoft/setup-msbuild@v3

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Verify tag version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match VERSION" }

      - name: Build .NET Framework projects
        run: msbuild FireEmblemThreeHouse.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /v:minimal

      - name: Package and verify downloads
        run: python tools/package.py

      - uses: actions/upload-artifact@v7
        with:
          name: fe3h-editor-release
          path: dist/*
          if-no-files-found: error

      - name: Generate release notes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes changelogithub@15.0.5 --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to generate release notes" }

      - name: Upload release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          gh release upload $env:GITHUB_REF_NAME `
            dist/FETH_SaveEditor.exe `
            "dist/fe3h-editor-v$version.zip" `
            dist/SHA256SUMS `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload release files" }

      - name: Verify downloadable files
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          New-Item -ItemType Directory -Path release-download | Out-Null
          gh release download $env:GITHUB_REF_NAME --dir release-download
          if ($LASTEXITCODE -ne 0) { throw "Failed to download release" }
          foreach ($name in @("FETH_SaveEditor.exe", "fe3h-editor-v$version.zip")) {
            $expected = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash
            $actual = (Get-FileHash "release-download/$name" -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "Download checksum mismatch: $name" }
          }
