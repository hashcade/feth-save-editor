name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose notes should be regenerated
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            cli: FethEditor.Cli.exe
          - os: macos-15
            rid: osx-arm64
            cli: FethEditor.Cli
          - os: macos-15
            rid: osx-x64
            cli: FethEditor.Cli
          - os: ubuntu-24.04
            rid: linux-x64
            cli: FethEditor.Cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify tag version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag does not match VERSION" }

      - name: Build and test
        run: dotnet build FethEditor.slnx -c Release --nologo

      - name: Verify CLI save editing
        run: python tools/test_cli.py --cli Cli/bin/Release/net10.0/${{ matrix.cli }}

      - name: Verify GUI rendering
        run: dotnet run --project Gui.Smoke/Gui.Smoke.csproj -c Release --no-build

      - name: Publish GUI
        run: dotnet publish Gui/FethEditor.Gui.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/gui/${{ matrix.rid }}

      - name: Publish CLI
        run: dotnet publish Cli/Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o dist/cli/${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: feth-release-${{ matrix.rid }}
          path: |
            dist/gui/${{ matrix.rid }}/
            dist/cli/${{ matrix.rid }}/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8
        with:
          pattern: feth-release-*
          path: packages

      - name: Assemble platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          mkdir -p dist
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            package="packages/feth-release-$rid"
            test -d "$package/gui/$rid"
            test -d "$package/cli/$rid"
            mkdir -p "staging/$rid/Gui" "staging/$rid/Cli"
            cp -R "$package/gui/$rid/." "staging/$rid/Gui/"
            cp -R "$package/cli/$rid/." "staging/$rid/Cli/"
            (cd "staging/$rid" && zip -qr "../../dist/feth-save-editor-v$version-$rid.zip" Gui Cli)
          done
          (cd dist && sha256sum ./*.zip > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Generate changelog and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes changelogithub@15.0.5 --to "$GITHUB_REF_NAME"

      - name: Upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber

      - name: Verify release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$GITHUB_REF_NAME" --dir release-download
          (cd release-download && sha256sum -c SHA256SUMS)

  refresh-notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Regenerate changelog for existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: npx --yes changelogithub@15.0.5 --to "$RELEASE_TAG"
